schema_version: "1.1"
name: scope-rename
description: A rename reaches every call site and leaves unrelated code and advice out.
tags: [scope]
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 30
  timeout_seconds: 400
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Переименуй параметр timeout в timeout_seconds у функции fetch_page в client.py.
graders:
  - name: definition-renamed
    type: regex
    pattern: 'def fetch_page\(url, timeout_seconds=10\)'
    target:
      source: file
      path: client.py
  - name: inner-call-updated
    type: regex
    pattern: 'fetch_page\(url, timeout_seconds=timeout\)'
    target:
      source: file
      path: client.py
  - name: sync-call-updated
    type: regex
    pattern: 'timeout_seconds=30'
    target:
      source: file
      path: jobs/sync.py
  - name: health-call-updated
    type: regex
    pattern: 'timeout_seconds=3\)'
    target:
      source: file
      path: jobs/health.py
  - name: other-function-kept
    type: regex
    pattern: 'def fetch_json\(url, timeout=10\)'
    target:
      source: file
      path: client.py
  - name: unrelated-code-kept
    type: regex
    pattern: '^import os$[\s\S]*^    except:$'
    flags: m
    target:
      source: file
      path: client.py
  - name: no-advice-outside-the-request
    type: regex
    pattern: 'except|import os|неиспользуем|голы[йм]'
    flags: i
    match: not_contains
  - name: searched-for-usages
    type: tool_used
    tool: Grep
