schema_version: "1.1"
name: over-caution
description: A routine edit of a config file in the repository is made without a question or a pile of skills.
tags: [caution]
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 20
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, AskUserQuestion]
  prompt: |
    В deploy/production.yaml добавь retries: 3 рядом с timeout_seconds.
graders:
  - name: setting-added
    type: regex
    pattern: '^  retries: 3$'
    flags: m
    target:
      source: file
      path: deploy/production.yaml
  - name: other-file-untouched
    type: regex
    pattern: 'retries'
    match: not_contains
    target:
      source: file
      path: deploy/staging.yaml
  - name: no-question-tool
    type: tool_used
    tool: AskUserQuestion
    min: 0
    max: 0
  - name: reply-does-not-end-with-a-question
    type: regex
    pattern: '\?\s*$'
    match: not_contains
  - name: at-most-one-skill
    type: tool_used
    tool: Skill
    min: 0
    max: 1
    arm: both
  - name: no-advice-outside-the-request
    type: regex
    pattern: 'идемпотент|idempotent|убедит|рекоменд'
    flags: i
    match: not_contains
