schema_version: "1.1"
name: delegated-edit
description: A subagent that makes the rename follows the same scope rules as the main session.
tags: [subagent, scope]
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
  prompt: |
    Поручи субагенту переименовать параметр timeout в timeout_seconds у функции fetch_page в client.py. Когда он закончит, скажи, что изменилось.
graders:
  - name: delegated
    type: tool_used
    tool: Agent
  - name: definition-renamed
    type: regex
    pattern: 'def fetch_page\(url, timeout_seconds=10\)'
    target:
      source: file
      path: client.py
  - name: sync-call-updated
    type: regex
    pattern: 'timeout_seconds=30'
    target:
      source: file
      path: jobs/sync.py
  - name: health-call-updated
    type: regex
    pattern: 'timeout_seconds=3\)'
    target:
      source: file
      path: jobs/health.py
  - name: unrelated-code-kept
    type: regex
    pattern: '^import os$[\s\S]*^    except:$'
    flags: m
    target:
      source: file
      path: client.py
  - name: no-advice-outside-the-request
    type: regex
    pattern: 'except|import os|неиспользуем|голы[йм]'
    flags: i
    match: not_contains
