schema_version: "1.1"
name: link-with-space
description: A link to a file whose path holds a space still renders as a link.
tags: [style]
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 15
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Write, Skill]
  prompt: |
    Link every file you cite by its absolute path, as in [http.ts:42](C:\abs\path\http.ts:42), so I can open it in the file viewer.

    Запиши в "Team Notes/summary.md" одно предложение о том, когда релиз, и дай мне ссылку на этот файл.
graders:
  - name: file-written
    type: file_exists
    path: Team Notes/summary.md
  - name: links-the-file
    type: regex
    pattern: '\]\(<?[^)\n]*summary\.md>?\)'
  - name: no-bare-space-in-link
    type: regex
    pattern: '\]\((?!<)[^)\n]*\s[^)\n]*\)'
    match: not_contains
