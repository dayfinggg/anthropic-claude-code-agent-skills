schema_version: "1.1"
name: commit-message
description: A commit message is short, conventional and says how the change was verified.
tags: [skills, style]
execution:
  max_turns: 15
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Напиши сообщение коммита для этого изменения. Тесты я прогнал командой npm test, все 48 проходят. Ответь только текстом сообщения.

    ```diff
    diff --git a/src/cart.js b/src/cart.js
    --- a/src/cart.js
    +++ b/src/cart.js
    @@ -12,7 +12,7 @@ function addItem(cart, item) {
    -  const existing = cart.items.find(entry => entry.id == item.id)
    +  const existing = cart.items.find(entry => entry.id === item.id && entry.variant === item.variant)
       if (existing) {
         existing.quantity += item.quantity
         return cart
    ```
graders:
  - name: conventional-description
    type: regex
    pattern: '^(fix|feat)(\([\w./-]+\))?: \S.{0,70}$'
    flags: m
  - name: verified-trailer
    type: regex
    pattern: '^Verified: .*48'
    flags: m
  - name: at-most-twelve-lines
    type: regex
    pattern: '(\n[^\n]*){13}'
    match: not_contains
  - name: plain-punctuation
    type: regex
    pattern: '[—–«»“”→]'
    match: not_contains
  - name: loaded-the-git-skill
    type: tool_used
    tool: Skill
    input_match: 'git'
