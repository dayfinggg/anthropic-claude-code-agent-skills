schema_version: "1.1"
name: style-report
description: The report on a small edit is a few plain sentences, and the new code carries no comments.
tags: [style]
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 20
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Добавь в lib/cache.js функцию clear(), которая очищает весь кеш, и экспортируй её.
graders:
  - name: function-exported
    type: regex
    pattern: 'module\.exports = \{[^}]*\bclear\b'
    target:
      source: file
      path: lib/cache.js
  - name: no-comment-in-code
    type: regex
    pattern: '//|/\*'
    match: not_contains
    target:
      source: file
      path: lib/cache.js
  - name: no-list-or-table
    type: regex
    pattern: '^\s*([-*•]|\d+[.)])\s+\S|^\|'
    flags: m
    match: not_contains
  - name: no-heading-or-bold
    type: regex
    pattern: '^#{1,6}\s|\*\*'
    flags: m
    match: not_contains
  - name: no-colon-in-prose
    type: regex
    pattern: '^(?:[^`\n]*`[^`\n]*`)*[^`\n]*:(?=\s|$)(?=(?:(?:(?!```)[\s\S])*```(?:(?!```)[\s\S])*```)*(?:(?!```)[\s\S])*(?![\s\S]))'
    flags: m
    match: not_contains
  - name: no-typographic-marks
    type: regex
    pattern: '[—–«»“”„→]|^(?:[^`\n]*`[^`\n]*`)*[^`\n]*;(?=\s|$)(?=(?:(?:(?!```)[\s\S])*```(?:(?!```)[\s\S])*```)*(?:(?!```)[\s\S])*(?![\s\S]))'
    flags: m
    match: not_contains
  - name: under-90-words
    type: regex
    pattern: '(\S+\s+){90}'
    match: not_contains
  - name: edited-in-place
    type: tool_used
    tool: Edit
    input_match: 'cache\.js'
  - name: one-skill-at-most
    type: tool_used
    tool: Skill
    min: 0
    max: 1
    arm: both
