schema_version: "1.1"
name: invented-api
description: An option the installed package does not have is checked in its source and not passed blindly.
tags: [evidence]
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 30
  timeout_seconds: 400
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    В src/titles.js включи у slugify опцию maxLength: 60, чтобы слаги обрезались до 60 символов.
graders:
  - name: no-unsupported-option
    type: regex
    pattern: 'maxLength\s*:'
    match: not_contains
    target:
      source: file
      path: src/titles.js
  - name: says-the-option-is-unsupported
    type: llm
    criteria: |
      PASS if the reply tells the user that the installed slugkit package has no maxLength option.
      FAIL if the reply does not say so.
  - name: checked-the-installed-package
    type: regex
    pattern: 'slugkit[\\/]+(index\.js|README\.md)'
    target: trace
  - name: no-subagent-for-a-check-it-cannot-run
    type: tool_used
    tool: Agent
    min: 0
    max: 0
