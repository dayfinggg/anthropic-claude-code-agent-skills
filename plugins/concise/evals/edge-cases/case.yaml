schema_version: "1.1"
name: edge-cases
description: A new parser fails on input it cannot read, and comes without comments or files nobody asked for.
tags: [solutions, scope]
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 30
  timeout_seconds: 400
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Напиши в durations.py функцию parse_duration(text). Она переводит строки вида "1h30m", "45s", "2h" в секунды.
graders:
  - name: rejects-what-it-cannot-parse
    type: llm
    focus:
      source: file
      path: durations.py
    criteria: |
      PASS if parse_duration raises an error for input it cannot parse in full, such as an empty string, "5x", "abc" or "1h30" with characters left over.
      FAIL if such input returns 0, returns a partial sum, or is skipped without an error. FAIL if the file is missing.
  - name: no-comment-or-docstring
    type: regex
    pattern: '#|"""|'''''''
    match: not_contains
    target:
      source: file
      path: durations.py
  - name: no-file-nobody-asked-for
    type: regex
    pattern: 'test|README|\.md$'
    flags: im
    match: not_contains
    target: files
  - name: wrote-the-module
    type: tool_used
    tool: Write
    input_match: 'durations\.py'
  - name: no-subagent-for-a-check-it-cannot-run
    type: tool_used
    tool: Agent
    min: 0
    max: 0
