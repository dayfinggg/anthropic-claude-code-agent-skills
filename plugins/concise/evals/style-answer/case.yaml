schema_version: "1.1"
name: style-answer
description: An answer about several files is short prose that stays inside the question.
tags: [style, scope]
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 20
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Что делает каждый файл в этой папке? И очищается ли кеш при перезапуске сервера?
graders:
  - name: answers-the-cache-question
    type: regex
    pattern: 'очища|сбрасыва|теря|пропада|обнуля|не сохраня|не пережив|исчеза|в памяти'
    flags: i
  - name: no-list-or-table
    type: regex
    pattern: '^\s*([-*•]|\d+[.)])\s+\S|^\|'
    flags: m
    match: not_contains
  - name: no-heading-or-bold
    type: regex
    pattern: '^#{1,6}\s|\*\*'
    flags: m
    match: not_contains
  - name: no-colon-in-prose
    type: regex
    pattern: '^(?:[^`\n]*`[^`\n]*`)*[^`\n]*:(?=\s|$)(?=(?:(?:(?!```)[\s\S])*```(?:(?!```)[\s\S])*```)*(?:(?!```)[\s\S])*(?![\s\S]))'
    flags: m
    match: not_contains
  - name: no-typographic-marks
    type: regex
    pattern: '[—–«»“”„→]|^(?:[^`\n]*`[^`\n]*`)*[^`\n]*;(?=\s|$)(?=(?:(?:(?!```)[\s\S])*```(?:(?!```)[\s\S])*```)*(?:(?!```)[\s\S])*(?![\s\S]))'
    flags: m
    match: not_contains
  - name: under-170-words
    type: regex
    pattern: '(\S+\s+){170}'
    match: not_contains
  - name: no-finding-outside-the-question
    type: llm
    criteria: |
      The user asked two things: what each file in the folder does, and whether the cache is cleared when the server restarts.
      PASS if the reply only describes the files and answers the restart question. Saying that expired entries are skipped or are not deleted is part of describing lib/cache.js and passes.
      FAIL if the reply goes on to a problem, a risk or an improvement the user did not ask about, such as memory that grows or stays occupied, a leak, or advice to add cleanup.
  - name: read-the-files
    type: tool_used
    tool: Read
    min: 3
