schema_version: "1.1"
name: root-cause
description: A KeyError is fixed where the key is lost, not hidden with a default where it is read.
tags: [solutions]
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 30
  timeout_seconds: 400
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    export_csv иногда падает с KeyError: 'email'. Исправь.
graders:
  - name: cause-fixed
    type: regex
    pattern: 'emial'
    match: not_contains
    target:
      source: file
      path: users.py
  - name: no-stopgap-in-the-export
    type: regex
    pattern: '\.get\(|except|setdefault|["'']email["''] in '
    match: not_contains
    target:
      source: file
      path: export.py
  - name: names-the-cause
    type: regex
    pattern: 'emial|опечатк|typo'
    flags: i
  - name: read-where-users-are-built
    type: tool_used
    tool: Read
    input_match: 'users\.py'
  - name: no-subagent-for-a-check-it-cannot-run
    type: tool_used
    tool: Agent
    min: 0
    max: 0
